
name: Deploy Demo (EC2)

on:
  push:
    branches:
      - demo
    paths:
      - "services/**"
      - "docker-compose.demo.yml"
      - ".github/workflows/demo-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosta-demo-deployment
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        service:
          - ads-service
          - ambulance-service
          - api-gateway
          - blood-bank-service
          - blooddonor-service
          - booking-service
          - bulmq-service
          - doctor-service
          - hospital-service
          - notification-service
          - review-service
          - role-service
          - s3-service
          - socketio-service
          - speciality-service
          - staff-service
          - user-service
          - auth-service

    steps:
      - name: Checkout demo code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build and push demo image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/hosta-${{ matrix.service }}:demo-latest
            ${{ secrets.DOCKER_USERNAME }}/hosta-${{ matrix.service }}:demo-${{ github.sha }}
          cache-from: type=gha,scope=demo-${{ matrix.service }}
          cache-to: type=gha,scope=demo-${{ matrix.service }},mode=max

  deploy:
    name: Deploy to Demo EC2
    needs: build
    runs-on: ubuntu-latest
    environment: demo

    steps:
      - name: Checkout demo code
        uses: actions/checkout@v4

      - name: Copy demo Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEMO_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEMO_EC2_SSH_KEY }}
          source: docker-compose.demo.yml
          target: /home/ubuntu/hostabackend-demo

      - name: Pull and deploy demo images
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        with:
          host: ${{ secrets.DEMO_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEMO_EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_PASSWORD
          script: |
            set -eu

            cd /home/ubuntu/hostabackend-demo

            echo "$DOCKERHUB_PASSWORD" | \
              sudo docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin

            sudo docker compose \
              -f docker-compose.demo.yml config -q

            sudo docker compose \
              -f docker-compose.demo.yml pull

            sudo docker compose \
              -f docker-compose.demo.yml up -d --no-build

            sudo docker compose \
              -f docker-compose.demo.yml ps

            echo "Demo deployment commands completed."
